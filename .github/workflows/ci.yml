name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck -S warning install.sh scripts/release.sh tests/run.sh tests/sim/herdr tests/sim/behave.sh
      - name: Compile orch
        run: python3 -m py_compile bin/orch
      - name: End-to-end tests (fake agents)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          bash tests/run.sh
      - name: Installer from checkout
        run: |
          export HOME=$(mktemp -d)
          bash install.sh --no-herdr-skill
          "$HOME/.local/bin/orch" version
          test -f "$HOME/.agents/skills/orch-plan/SKILL.md"
          test -f "$HOME/.config/opencode/commands/orch-run.md"
          test -f "$HOME/.agents/skills/orch-explain/SKILL.md"
          ls -d "$HOME/.local/share/herdr-orchestra"/v*
      - name: npm package
        run: |
          test "$(node -p "require('./package.json').version")" = "$(tr -d '[:space:]' < VERSION)"
          npm pack --dry-run 2>&1 | grep -q 'npm/cli.js'
          export HOME=$(mktemp -d)
          npm pack --silent && npx --yes ./herdr-orchestra-*.tgz --no-herdr-skill
          "$HOME/.local/bin/orch" version
          ls -d "$HOME/.local/share/herdr-orchestra"/v*
          case "$(ls "$HOME/.local/share/herdr-orchestra")" in *-dev*) echo "npm install must not be -dev"; exit 1;; esac
      - name: Pi package (manifest files packed, extension type-checks against Pi)
        run: |
          npm pack --dry-run 2>&1 | grep -q 'extensions/orch-mode.ts'
          npm pack --dry-run 2>&1 | grep -q 'pi/skills/orch-plan/SKILL.md'
          npm pack --dry-run 2>&1 | grep -q 'skills/orch-explain/SKILL.md'
          d=$(mktemp -d)
          npm install --prefix "$d" --silent --no-audit --no-fund @earendil-works/pi-coding-agent typescript@5 @types/node@22
          printf '{"compilerOptions":{"target":"ES2022","module":"ESNext","moduleResolution":"Bundler","strict":true,"noEmit":true,"skipLibCheck":true,"types":["node"],"typeRoots":["%s/node_modules/@types"],"baseUrl":"%s","paths":{"@earendil-works/pi-coding-agent":["node_modules/@earendil-works/pi-coding-agent"]}},"files":["%s/extensions/orch-mode.ts"]}' "$d" "$d" "$PWD" > "$d/tsconfig.json"
          "$d/node_modules/.bin/tsc" -p "$d/tsconfig.json"
