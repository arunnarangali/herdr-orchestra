name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck -S warning install.sh scripts/release.sh tests/run.sh tests/sim/herdr tests/sim/behave.sh
      - name: Compile orch
        run: python3 -m py_compile bin/orch
      - name: End-to-end tests (fake agents)
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          bash tests/run.sh
      - name: Installer from checkout
        run: |
          export HOME=$(mktemp -d)
          bash install.sh --no-herdr-skill
          "$HOME/.local/bin/orch" version
          test -f "$HOME/.agents/skills/orch-plan/SKILL.md"
          test -f "$HOME/.config/opencode/commands/orch-run.md"
          ls -d "$HOME/.local/share/herdr-orchestra"/v*
      - name: npm package
        run: |
          test "$(node -p "require('./package.json').version")" = "$(tr -d '[:space:]' < VERSION)"
          npm pack --dry-run 2>&1 | grep -q 'npm/cli.js'
          export HOME=$(mktemp -d)
          npm pack --silent && npx --yes ./herdr-orchestra-*.tgz --no-herdr-skill
          "$HOME/.local/bin/orch" version
          ls -d "$HOME/.local/share/herdr-orchestra"/v*
          case "$(ls "$HOME/.local/share/herdr-orchestra")" in *-dev*) echo "npm install must not be -dev"; exit 1;; esac
