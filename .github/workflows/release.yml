name: Release
# A release is made by itself: when a merge to main carries a VERSION that has no tag yet, this tests it, tags
# vX.Y.Z on that commit and publishes the GitHub Release with its own install.sh. Nobody has to push a tag.
# It then publishes the same version to npm (`npx herdr-orchestra@latest`) when the NPM_TOKEN secret is set.
# Pushing a tag by hand still works (the tag must match VERSION).
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write   # npm provenance
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which release
        id: v
        run: |
          TAG="v$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$TAG" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match VERSION ($TAG)"; exit 1; }
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists already: nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_TYPE" != tag ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
               && [ "$(git rev-list -n1 "$TAG")" != "$GITHUB_SHA" ]; then
            echo "::error::tag $TAG is on another commit: bump VERSION and add a CHANGELOG section"; exit 1
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tests
        if: steps.v.outputs.skip == 'false'
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          bash tests/run.sh
      - name: Tag and publish the GitHub Release
        if: steps.v.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          V="${TAG#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## /{if(f) exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $TAG" > notes.md
          mkdir -p dist
          sed "s/^RELEASE_TAG=\"\"/RELEASE_TAG=\"$TAG\"/" install.sh > dist/install.sh
          grep -q "^RELEASE_TAG=\"$TAG\"" dist/install.sh
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md dist/install.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set: skipping the npm publish"; exit 0
          fi
          test "$(node -p "require('./package.json').version")" = "$V" || { echo "::error::package.json version does not match VERSION"; exit 1; }
          if npm view "herdr-orchestra@$V" version >/dev/null 2>&1; then
            echo "herdr-orchestra@$V is on npm already: nothing to do."; exit 0
          fi
          npm publish --provenance --access public
