# herdr-orchestra agent registry — one table per agent kind.
# Override or add kinds in ~/.config/herdr-orchestra/agents.toml (merged key by key over this file).
#
#   binary        executable that must be on PATH for the kind to count as installed
#   launch        command to start it in a herdr pane, with its auto-approve-edits option
#   review_launch optional: the command for the REVIEWER pane, with the tool's code-editing tools turned off (the
#                 reviewer only reads the change and writes its review file). `orch team up` uses it for the reviewer;
#                 `orch agents launch <kind> --role reviewer` prints it. Left out: the reviewer starts like a coder
#   model_flag    the launch option that picks the model (`orch agents launch <kind> --model <id>`); leave it
#                 out when the tool has none or it is unverified, and choose the model inside the tool
#   effort_flag   the launch option that sets how hard the model thinks, with {effort} where the level goes. A model
#                 id written `<model>@<level>` (e.g. gpt-6.2-sol@low) starts on <model> with this option
#   efforts       the thinking levels the tool accepts, in order; `orch plan team` offers them and `orch plan model`
#                 refuses any other
#   lead_flags    optional: options added only to the LEAD's start command (`orch team <kind>`, `orch agents launch
#                 <kind> --role lead`), never to coders or the reviewer, whose panes run unattended
#   launch_needs  parts the launch command must keep for orch to work in that tool; `orch doctor` says when your
#                 own launch drops one. In `launch`, {git_dir} is the repo's .git folder (filled in by orch)
#   herdr_detect  herdr can tell idle / working / blocked for it (false: orch relies on the done file only)
#   interrupt_keys the keys that stop its current step, as `herdr agent send-keys` names them (default ["esc"]).
#                 orch presses them when a milestone is paused or moved while the coder still works, before the
#                 STOP note: a typed message is only read after the current step (agy queues it)
#   compact       the command that shrinks the tool's chat to a short summary (e.g. "/compact"). orch types it into a
#                 coder's or the reviewer's pane when its milestone is done, before it starts another one, while
#                 herdr shows it idle (never the lead). Leave it out (or "") for a tool where it is not known to work
#   compact_min_version  the first version of the tool that has that command: an older (or unreadable)
#                 `<binary> --version` means no compacting, said once in `orch story`
#   roles         any of "lead", "coder", "reviewer"
#   skills_dirs   global SKILL.md folders the installer may put the orch-plan / orch-run / orch-explain skills into
#                 (first = preferred)
#   skills_reads  every global skills folder the tool reads, its own and shared ones (e.g. ~/.agents/skills).
#                 `orch agents sync` picks the fewest folders so each installed tool reads exactly ONE copy
#                 of each skill (a skill in two folders it reads is listed twice), and removes orch's copies
#                 from every other folder
#   commands_dirs slash-command folders the installer may put orch-plan.md / orch-run.md / orch-explain.md into
#   skills_one_wins true when the tool shows a skill once even if two folders it reads have it (its docs
#                 say one copy wins); false or unset: it lists both, so orch keeps exactly one copy
#   commands_reads every slash-command folder the tool reads (same one-copy rule)
#   old_dirs      folders older versions installed into and no longer use: sync removes orch's copies there
#   commands_from which command flavour to install there: "claude-commands" or "opencode-commands"
#   invoke        how the developer starts the plan playbook in that agent
#   verified      true only when the launch option and skills folder were checked against the real tool
#                 (herdr_detect comes from herdr's own list of agent kinds: `herdr agent` prints it)
#   notes         what was (or wasn't) verified
#
# Every agent can also lead with the universal sentence: Run `orch lead plan` and follow it. Feature: <...>

[claude]
binary = "claude"
launch = "claude --permission-mode acceptEdits"
review_launch = "claude --permission-mode acceptEdits --disallowedTools Edit,NotebookEdit"
model_flag = "--model"
herdr_detect = true
interrupt_keys = ["esc"]
compact = "/compact"
roles = ["lead", "coder", "reviewer"]
skills_dirs = ["~/.claude/skills"]
skills_one_wins = true
old_dirs = ["~/.claude/commands"]
invoke = "/orch-plan <feature>"
verified = true
notes = "Claude Code 2.1: --permission-mode acceptEdits in --help; ~/.claude/skills present; herdr kind 'claude'. A skill is also a slash command (/orch-plan) and its docs say a skill beats a ~/.claude/commands file of the same name, so no commands copy is installed. review_launch: --disallowedTools is in --help (2.1); the reviewer keeps Write for its review file."

[codex]
binary = "codex"
# Codex runs every command in its sandbox, which blocks two things orch needs: talking to herdr (a local socket,
# blocked with the network) and writing the repo's .git (branches, worktrees, commits). These two settings open
# exactly that, so `orch start`, `orch team up` and every herdr call work the first time instead of each one
# waiting for an approval review.
launch = "codex --approve-for-me -c sandbox_workspace_write.network_access=true -c 'sandbox_workspace_write.writable_roots=[\"{git_dir}\"]'"
launch_needs = ["sandbox_workspace_write.network_access=true", "sandbox_workspace_write.writable_roots"]
# The lead only: Codex's question picker (request_user_input) outside Plan mode, so /orch-plan asks its questions
# in a picker. Coders never get it: a picker in an unattended pane would wait for nobody.
lead_flags = "-c features.default_mode_request_user_input=true"
model_flag = "--model"
effort_flag = "-c model_reasoning_effort={effort}"
efforts = ["low", "medium", "high", "xhigh", "max"]
herdr_detect = true
interrupt_keys = ["esc"]
compact = "/compact"
roles = ["lead", "coder", "reviewer"]
skills_dirs = ["~/.agents/skills", "~/.codex/skills"]
skills_reads = ["~/.agents/skills", "~/.codex/skills"]
invoke = "$orch-plan <feature>   (or: use the orch-plan skill: <feature>)"
verified = true
notes = "codex-cli 0.167: --full-auto is gone; --approve-for-me routes approvals to automatic review in the workspace-write sandbox. Reads ~/.codex/skills and ~/.agents/skills (its docs name ~/.agents/skills as the user folder, and say two skills with the same name both show up, so orch keeps one copy). codex-cli 0.172 (checked with `codex sandbox`): in workspace-write, .git is read-only and connecting to a local socket is refused; sandbox_workspace_write.network_access=true lets the herdr socket through (it also allows the internet) and writable_roots with the repo's .git lets git work. Thinking level: -c model_reasoning_effort=low|medium|high|xhigh|max. `codex debug models` lists the models this Codex has (see [discover.codex] in models.default.toml). codex-cli 0.172 (checked with `codex features list`): default_mode_request_user_input is an 'under development' feature, off by default; -c features.default_mode_request_user_input=true turns it on (request_user_input is refused in `codex exec`)."

[amp]
binary = "amp"
launch = "amp"
herdr_detect = true
interrupt_keys = ["esc"]
roles = ["lead", "coder", "reviewer"]
skills_dirs = ["~/.config/agents/skills", "~/.agents/skills"]
skills_reads = ["~/.config/agents/skills", "~/.agents/skills"]
skills_one_wins = true
invoke = "use the orch-plan skill: <feature>"
verified = true
notes = "No auto-approve CLI flag; set amp.dangerouslyAllowAll or `amp permissions add` rules in its settings. `amp skill list` lists skills."

[opencode]
binary = "opencode"
launch = "opencode"
model_flag = "--model"
herdr_detect = true
interrupt_keys = ["esc", "esc"]
roles = ["lead", "coder", "reviewer"]
skills_dirs = []
skills_reads = ["~/.agents/skills", "~/.claude/skills"]
skills_one_wins = true
commands_dirs = ["~/.config/opencode/commands"]
commands_reads = ["~/.config/opencode/commands", "~/.config/opencode/command"]
commands_from = "opencode-commands"
invoke = "/orch-plan <feature>"
verified = true
notes = "Reads ~/.agents/skills and ~/.claude/skills, so only its slash commands are installed."

[hermes]
binary = "hermes"
launch = "hermes"
herdr_detect = true
interrupt_keys = ["esc"]
roles = ["lead", "coder", "reviewer"]
skills_dirs = ["~/.hermes/skills"]
invoke = "use the orch-plan skill: <feature>"
verified = false
notes = "Not installed on the machine this was written on: launch flag and skills folder unverified. herdr 0.9.5 lists 'hermes' as a known kind. Hermes runs tools in its gateway, so the pane's HERDR_* env is missing there unless ~/.hermes/config.yaml sets terminal.client_env_passthrough: [HERDR_ENV, HERDR_PANE_ID, HERDR_SOCKET_PATH, HERDR_BIN_PATH] (see `orch lead check`)."

[agy]
binary = "agy"
launch = "agy --mode accept-edits"
herdr_detect = true
interrupt_keys = ["esc"]
compact = "/compact"
compact_min_version = "1.2.15"
roles = ["lead", "coder", "reviewer"]
skills_dirs = ["~/.gemini/config/skills"]
invoke = "use the orch-plan skill: <feature>"
verified = true
notes = "Antigravity CLI 1.5: --mode accept-edits|auto|plan and --dangerously-skip-permissions. The binary documents ~/.gemini/config/skills/<name>/SKILL.md as the global skills folder."

[pi]
binary = "pi"
launch = "pi"
model_flag = "--model"
herdr_detect = false
interrupt_keys = ["esc"]
roles = ["lead", "coder", "reviewer"]
skills_dirs = ["~/.agents/skills"]
skills_reads = ["~/.pi/agent/skills", "~/.agents/skills"]
invoke = "/skill:orch-plan <feature>"
verified = false
notes = "Pi (pi.dev, npm @earendil-works/pi-coding-agent 1.6): `pi install npm:herdr-orchestra` adds the orch skills and the orch-mode extension (/orch-mode, /orch-setup). Pi also reads ~/.agents/skills, so it may warn once that orch-plan / orch-run are found twice; it keeps the first copy. Docs list `--model`; herdr detection of Pi is unverified, so orch relies on the done file in panes mode. Subagent mode (one Pi window): `/orch-mode subagent` in Pi sets it up (or `orch setup --mode subagent` in a terminal)."
